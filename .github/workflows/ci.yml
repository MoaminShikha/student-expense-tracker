name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xfixes0 libxcb1 xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      # Core layers (domain/application/ports/infrastructure) are type-clean and
      # enforced. The Qt GUI layer still has type debt, so it stays advisory.
      - name: Type check core (strict)
        run: mypy src/expense_tracker/domain src/expense_tracker/application src/expense_tracker/ports src/expense_tracker/infrastructure --ignore-missing-imports

      - name: Type check GUI (advisory)
        run: mypy src/expense_tracker/app --ignore-missing-imports
        continue-on-error: true

      - name: Run tests (headless)
        run: xvfb-run -a pytest tests/ --tb=short -q --cov=src/expense_tracker --cov-report=term-missing --cov-fail-under=35
        env:
          QT_QPA_PLATFORM: offscreen
