[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "student-expense-tracker"
version = "0.2.0"
description = "Personal finance management app for Israeli university students - track committed vs free money"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Moamin Shikha", email = "moamin.shikha@mail.huji.ac.il"}
]
requires-python = ">=3.10"
keywords = ["finance", "budgeting", "student", "PyQt6", "personal-finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "PyQt6>=6.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.2.0",
    "black>=23.12.0",
    "isort>=5.13.2",
    "ruff>=0.1.8",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
    "types-PyQt6>=6.7.0",
    "pre-commit>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/moamin/student-expense-tracker"
Documentation = "https://github.com/moamin/student-expense-tracker/blob/main/Docs"
Repository = "https://github.com/moamin/student-expense-tracker.git"
"Bug Tracker" = "https://github.com/moamin/student-expense-tracker/issues"

[project.scripts]
student-expense-tracker = "expense_tracker.app.cli:main"
mizaan = "expense_tracker.app.gui.main:main"

[tool.setuptools]
packages = ["expense_tracker"]

[tool.setuptools.package-data]
expense_tracker = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-vv -ra --tb=short --color=yes --strict-markers --durations=10"
console_output_style = "progress"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "slow: slow running tests",
]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true

[tool.ruff]
line-length = 120
target-version = "py310"
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by black)
    "W503",   # line break before binary operator
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
